name: paydayadvance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  easy_localization_loader: ^2.0.2

  go_router: ^16.2.2

  url_launcher: ^6.3.2
  internet_connection_checker_plus: ^2.7.2
  yaml: ^3.1.3

  wakelock_plus: ^1.4.0
  flutter_udid: ^4.0.0
  shared_preferences: ^2.5.3

  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1

  logger: ^2.6.1
  get_it: ^8.2.0
  provider: ^6.1.5+1

  flutter_svg: ^2.2.1
  flutter_screenutil: ^5.9.3
  flutter_dash: ^1.0.0
  google_fonts: ^6.3.1
  animated_switcher_plus: ^1.4.0
  flutter_markdown: ^0.7.7+1

  in_app_review: ^2.0.11
  store_redirect: ^2.0.4
  flutter_native_splash: ^2.4.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter_icons:
  android: true
  ios: true
  min_sdk_android: 22
  image_path_android: "assets/images/main_logo_play_store.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/main_logo_play_store.png"
  image_path_ios: "assets/images/main_logo_app_store.png"
  remove_alpha_ios: true


# The following sections is specific to flutter_native_splash
# Customize the parameters below, and run the following command in the terminal:
# > flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/native_splash_play_store.png"
  android_12:
    image: "assets/images/native_splash_play_store.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
  image_ios: "assets/images/native_splash_app_store.png"
  color_ios: "#FFFFFF"

flutter:


  uses-material-design: true

  assets:
      - assets/images/
      - assets/texts/
      - assets/translations/
