sections:
- body: "**Effective Date: June 18, 2025**\n\nBy accessing or using the **Payday Advance - Borrow Money** (the \"App\"), you agree to be bound by these Terms of Use.  \nPlease read them carefully. If you do not agree, you should discontinue using the App immediately.\n"
  title: Terms of Use
- body: "The App is **not a direct lender**.  \nIt serves as a platform that connects users with independent third-party lenders within an online network.  \nThe App does not make lending decisions or determine loan terms.  \n\nPlease also review our **Privacy Policy** before using the service.\n"
  title: Service Functionality
- body: "- Loan repayment terms offered by partner lenders typically range from a **minimum of 2 months** up to a **maximum of 60 months**.  \n- **Annual Percentage Rates (APRs)** vary between **5.94% and 35.99%**, with the lowest rates available only to highly qualified borrowers.  \n\n**Representative Example:**  \n\n- **Loan Amount:** $10,500  \n- **Loan Term:** 56 months  \n- **APR:** 16.55%  \n- **Monthly Payment:** $270.36  \n- **Total Amount Payable:** $15,140.16  \n- **Total Interest:** $4,640.16  \n\nThe exact loan terms you receive depend on factors such as your credit history, credit utilization, repayment ability, and loan duration.  \nMissing payments or incurring additional fees can increase the total cost of the loan.  \n\n⚠️ The App does **not guarantee** that the terms provided by partner lenders will be the best available in the marketplace.\n"
  title: Loan Terms
- body: "The App uses personal information solely to connect users with eligible creditors.  \nUsers should avoid sharing sensitive or non-public information outside the App.  \nThe App cannot guarantee a loan match or a specific approval amount.  \n\nBy submitting a loan request, you may consent to receiving repeated communications from the App, its affiliates, lenders, or third-party marketers.  \nThese may include **phone calls, text messages, SMS, autodialed calls, or pre-recorded messages**.  \n\nProviding such consent is **not mandatory** for using the App's services, and you may revoke it at any time.\n"
  title: Use of Personal Information
- body: "Partner lenders review submitted applications in real time to determine whether users meet underwriting criteria.  \nAs part of this process, lenders may:  \n\n- Conduct **soft or hard credit checks**.  \n- Verify submitted information using national databases (including **Teletrack**).  \n- Research customer history with other lenders.  \n\nBy applying for a loan, you authorize partner lenders to evaluate, validate, and investigate your information.  \n\nIf your application meets lender criteria, you may be redirected to a lender's website.  \nAt that stage, the App is no longer involved in your application.  \nYour relationship is then directly with the lender, and you will be subject to their specific terms and conditions.\n"
  title: Credit Checks and Verification
- body: "Users are responsible for ensuring that all information provided through the App is accurate and truthful.  \nThe App reserves the right to **suspend, reject, or terminate service** if false or misleading information is detected.\n"
  title: Accuracy of Information
- body: "The App may update, change, or discontinue any part of its features, functions, or services **at any time without prior notice**.  \n\nThe App may also restrict access if a user's activity is deemed (at the sole discretion of the App) to violate these Terms, infringe on the rights of others, or otherwise be inappropriate.  \n\nThe App is not liable for delays or disruptions in service caused by user errors in submission or technical issues outside its control.\n"
  title: Supervision of Features and Access
- body: "The App may provide links to websites or services operated by **third parties**.  \nThese links are offered for user convenience only.  \nThe App does not control, endorse, or guarantee third-party products, services, or content.  \nInclusion of a link does not imply approval or sponsorship by the App.\n"
  title: Third-Party Links
- body: "The App applies reasonable safeguards to protect user information.  \nHowever, by using the App, you acknowledge and agree that:  \n\n- Your data may be shared with partner lenders.  \n- The App does not oversee how lenders use your personal data.  \n- You may receive promotional communications or advertisements from lenders and affiliates.  \n\n**Best practice:** Use a dedicated email address for loan applications to minimize spam and irrelevant contacts.  \nAvoid submitting company or family email addresses and phone numbers.\n"
  title: Privacy Disclaimer
- body: "- **Minimum Repayment Period:** 61 days  \n- **Maximum Repayment Period:** 60 months  \n\n**APRs** range from **5.94% to 35.99%**, depending on your financial background and the loan option selected.  \n\nThese are typically unsecured loans, and some lenders may offer them without performing a hard credit check.\n"
  title: Loan Repayment and APR
- body: "For questions about the use of the App, please contact us at:  \n\n📧 **info@deltacreditsas.com**\n"
  title: Contact Us
