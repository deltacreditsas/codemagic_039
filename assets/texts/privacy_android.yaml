sections:
- body: "**Effective Date: June 18, 2025**\n\nThis Privacy Policy applies to the use of the **Payday Advance - Borrow Money** (hereinafter referred to as the \"App\"). Its purpose is to explain what services the App provides, the types of data collected from users, how that data is used, and under what circumstances it may be shared."
  title: Privacy Policy
- body: "The App operator is **not a lender or broker**. The App itself does not participate in credit decisions or financial transactions. Instead, it provides a loan-matching service, securely forwarding the information you provide to trusted third-party lenders. These lenders determine their own terms, such as APRs, fees, repayment schedules, and other loan requirements."
  title: Disclosure
- body: "The App collects both:\n\n**Personally Identifiable Information (PII)** – information that can directly identify you.\n\n- Examples include: full name, mailing address, phone number, Social Security Number, email, date of birth, driver's license number, residency details, employment information, paycheck details, homeownership status, and bank account details.\n\n- This information is typically collected when you complete a loan request form or submit inquiries through the App.\n\n**Non-Personally Identifiable Information (Non-PII)** – data that cannot be traced back to you individually.\n\n- Examples include: IP address, browser type, language settings, access times, clickstream activity, and which areas of the App you visit.\n\n- Such data may be collected directly through cookies or by third-party tracking tools.\n\n**Cookies:** Cookies are small files placed on your device during browsing to help recognize you on future visits. They do not directly identify you.\n\nNon-PII may be shared with suppliers or third parties for statistical analysis, performance tracking, or marketing trend reviews.\n\nLenders and advertising partners may also use cookies or similar technologies to measure interactions with their advertisements on the App. However, the App does **not** provide your PII to these parties."
  title: Information the App Collects
- body: "PII is collected and used only to deliver the services requested by you. Specifically:\n\n- To forward your loan application to network lenders.\n\n- To help resolve disputes, technical issues, or enforce agreements.\n\n- To facilitate communication from partner lenders regarding your application.\n\n- To share relevant offers or services from trusted financial partners.\n\nBy providing PII, you consent to its use and limited disclosure, in compliance with applicable laws, to affiliated service providers, lenders, and marketing partners.\n\nThe App operator does not directly access the details you enter on loan application forms. Instead, your information is securely transferred to lenders within the network.\n\nBy submitting your information, you also consent to being contacted by lenders about your request. You waive the right to file complaints with agencies such as the FTC regarding this lender communication."
  title: How the App Uses Personally Identifiable Information
- body: "Your information may be shared in the following cases:\n\n- With participating lenders, affiliates, and service providers to process your loan request.\n\n- In compliance with subpoenas, court orders, law enforcement requests, or other legal obligations.\n\n- When necessary to protect legal rights, investigate fraud or unlawful activity, or enforce our Terms and Conditions.\n\n- In connection with mergers, acquisitions, or business transfers where data sharing is required.\n\nPlease note that each third party operates under its own privacy policy, which may differ from this one."
  title: Sharing of Personal Information
- body: "When you submit PII, you automatically opt in to receiving communications. However, you may refuse or opt out of subsequent marketing communications from third parties at any time."
  title: Refusal of Communications
- body: "The App may contain links or redirect you to external websites or services not governed by this Privacy Policy. Please review the respective terms and privacy policies of those third-party sites before engaging with them."
  title: Links to Other Sources
- body: "The App may revise, update, or amend this Privacy Policy at its sole discretion and without prior notice. Any changes take effect immediately once posted."
  title: Policy Changes
- body: "The App is not designed for individuals under the age of 18 (or the legal age of majority in your jurisdiction). The App does not knowingly collect PII from children. If such data is discovered, it will be deleted promptly."
  title: Children's Privacy
- body: "The App employs industry-standard measures to protect user information from unauthorized access, misuse, or disclosure. Data transmitted to lenders is encrypted using Secure Socket Layer (SSL) technology."
  title: Security
- body: "California residents have additional privacy rights under state law. Businesses that collect PII and share it with third parties must either:\n\n- Provide a list of categories of PII shared and the entities that received it, or\n\n- Offer a mechanism allowing users to opt out of data sharing for marketing purposes.\n\nYou may opt out of marketing communications by following the instructions provided in those materials.\n\nAdditionally, California residents can submit complaints to the:\n\n**California Department of Consumer Affairs**  \n400 R Street, Suite 1080  \nSacramento, CA 95814  \nPhone: 916-445-1254 or 800-952-5210  \nEmail: dca@dca.ca.gov"
  title: Privacy Rights for California Residents
- body: "If you have any questions or concerns about this Privacy Policy or the App's practices, you may contact us anytime."
  title: Contact Us
